id: thinkpad-t14
name: Lenovo ThinkPad T14
enabled: true
provider: ebay
schema_version: 1

# ---------------------------------------------------------------------------
# 1. SEARCH — pushed to the API. Anything filtered here costs no rate budget.
# ---------------------------------------------------------------------------
search:
  queries:
    - "Lenovo ThinkPad T14"

  # Negative terms in `q` are best-effort on Browse and behave inconsistently.
  # Treat these as an optimisation only. The reject rules below are the
  # authoritative filter — never rely on the API to keep junk out.
  query_exclude:
    - T14s
    - dock
    - palmrest

  category_ids:
    - "177"          # PC Laptops & Netbooks

  filters:
    conditionIds: [2000, 2500, 3000]     # cert refurb, seller refurb, used, auction removed
    # eBay's set filter is OR, not AND. [FIXED_PRICE, BEST_OFFER] admitted
    # ["AUCTION","BEST_OFFER"] listings — an auction whose offer channel
    # closes on the first bid. Those have no `price` field, only
    # currentBidPrice, and failed to map (4/sweep). BIN-with-Best-Offer
    # still matches on FIXED_PRICE; auction+BIN still comes through, and
    # its `price` is a real BIN. buying_options is still recorded per
    # observation, so scoring.best_offer_weight is unaffected.
    buyingOptions: [FIXED_PRICE]
    # Raised from 1200: the search filter is the only lossy stage — a
    # listing never fetched cannot be backfilled from raw_json later.
    # Truncating at 1200 would compute Gen 5/6 medians from the bottom
    # tail only, biasing p25 low and under-alerting on those buckets. The
    # buying ceiling belongs in alerts.max_price_usd below, not here.
    price: [80, 2000]
    priceCurrency: USD
    itemLocationCountry: US

  poll:
    interval_minutes: 5
    sweep_interval_minutes: 60           # deep pagination, refreshes active set
    sort: newlyListed

# ---------------------------------------------------------------------------
# 2. REJECT — runs BEFORE require, deliberately: `\bT14\b` does not match
#    "T14s" (no word boundary between "4" and "s"), so require-first would
#    classify every T14s listing as not_target and the t14s-not-t14 rule
#    below would report zero hits forever. First match wins; the rest are
#    not evaluated. See design.md §5.1.
# ---------------------------------------------------------------------------
reject:
  # '[\s-]?' between T and 14 (V0.7a): real sellers write "T 14s" with a
  # space. Must stay in lockstep with is-t14's require pattern below - if
  # require widens to accept spaced "T 14" but this doesn't widen too,
  # spaced T14s listings pass require and get scored as if they were T14.
  - id: t14s-not-t14
    where: title
    any:
      - '\bT[\s-]?14\s?s\b'
    reason: "T14s is a different machine with a different price curve"

  # This reads 0 hits in the V0.7 report because search.filters.conditionIds
  # above already excludes 7000 at the API level - the rule never gets a
  # chance to fire. That's intentional belt-and-braces (a filter change
  # elsewhere shouldn't silently reopen this hole), not a dead rule to prune.
  - id: for-parts-condition
    where: condition_id
    in: [7000]
    reason: "For parts or not working"

  # title only, not subtitle: Browse returns no subtitle - measured live,
  # 145 of 145 listings had none (design.md §5.1). A subtitle match here
  # was dead code by accident, before the engine existed to notice.
  - id: for-parts-text
    where: title
    any:
      - 'for\s+parts'
      - '\bparts\s+only\b'
      - '\bas[\s-]?is\b'
      - '\bnot\s+working\b'
      - '\bbios\s+lock'
      - '\bcracked\b'
      - '\bbad\s+battery\b'
      - '\bno\s+power\b'
    reason: "For parts, as-is, or otherwise not working"

  - id: barebones
    where: title
    any:
      - '\bbarebones?\b'
      # `os` deliberately excluded: "16GB 256GB NVMe No OS" is a complete
      # machine missing only a Windows license, not a barebones unit, and
      # is systematically cheaper - rejecting the class removed the low
      # end of every bucket and biased medians upward. See CLAUDE.md and
      # the no_os extract field below.
      - '\bno\s+(ram|ssd|hdd|memory|storage|drive)\b'
      - '\bno\s+hard\s+drive\b'
      - '\bw/?o\s+(ram|ssd|hdd)\b'
    reason: "Drags bucket medians down hard; primary source of false alerts"

  - id: lot-listing
    where: title
    any:
      - '\blot\s+of\s+\d+'
      - '\b(qty|quantity)\s*[:.]?\s*[2-9]\d*\b'
      - '\bx\s?[2-9]\b'
      - '\bbulk\b'
      - '\bwholesale\b'
    reason: "One listing, N machines. Price is not comparable."

  - id: accessory
    where: title
    any:
      - '\b(dock|docking\s+station|palmrest|keyboard|lcd|screen\s+assembly)\b'
      # `fan` and `webcam` removed (V0.7a): neither is sold as a standalone
      # T14 part in any real volume, and both appear routinely in ordinary
      # whole-laptop feature lists ("...16GB DDR5, 512GB SSD, Webcam, 4G").
      # That was silently rejecting every Core Ultra listing whose spec
      # list happened to mention a webcam, since Core Ultra ("Ultra 7
      # 165U") wasn't in the `unless` CPU alternation below either - see
      # CLAUDE.md and the real listing this fixes in tests/fixtures/titles.txt.
      - '\b(motherboard|mainboard|bezel|hinge|heatsink)\b'
      - '\b(charger|ac\s+adapter|power\s+supply|sleeve|case|bag)\b'
    unless:
      # Accessory words legitimately appear in whole-laptop listings
      # ("T14 laptop with dock included"). Don't reject those.
      - '\b(laptop|notebook|ultrabook)\b'
      # `ultra` added (V0.7a): Core Ultra is exactly the Gen 5/6 silicon
      # this profile most cares about, and "i[3579]|ryzen" doesn't cover it.
      - '\b(i[3579]|ryzen)\b|\bultra\s*[3579]\b'
    reason: "Matches the keyword search but is not the machine"

# ---------------------------------------------------------------------------
# 2b. REQUIRE — runs after reject, before extraction. All rules must match;
#     failing any one means not_target (design.md §5.2).
# ---------------------------------------------------------------------------
require:
  # '[\s-]?' between T and 14 (V0.7a): two real listings were lost to
  # sellers writing "T 14" with a space ("Lenovo Thinkpad T 14 Gen 1...",
  # "Lenovo T 14 Gen 4..."). "T14SGen2" (no space, capital S) still
  # correctly stays not_target either way - there's no word boundary
  # between "4" and "S" for \b to land on, same as before this change.
  - id: is-t14
    where: title
    any:
      - '\bT[\s-]?14\b'
    reason: "Browse query_exclude is best-effort; T13/X13/T480 come back"

# ---------------------------------------------------------------------------
# 3. EXTRACT — ordered rules per field, first match wins.
#    Capture groups referenced as {1}, {2}. `apply` names a function from
#    normalize/functions.py.
# ---------------------------------------------------------------------------
extract:
  generation:
    from: title
    rules:
      - pattern: '\bgen\s*([1-6])\b'
        value: '{1}'
      - pattern: '\bg([1-6])\b'
        value: '{1}'
    default: null

  cpu_family:
    from: title
    rules:
      # AMD — generation is inferable from the Ryzen series, see derive below.
      # The series digit ([3579]) is OPTIONAL (V0.7c) - real sellers write
      # "Ryzen PRO 8540U" with no series digit at all ("Lenovo ThinkPad
      # T14 Gen 5 | 14" Ryzen PRO 8540U Radeon 740M 16GB 1TB Win 11 Pro",
      # tests/fixtures/titles.txt). The four-digit model number stays
      # mandatory - "Ryzen 5 PRO" alone, with no model number, still
      # matches nothing here and cpu_family stays null. Bare CPU markers
      # with no model number are a separate inference decision, out of
      # scope for a pattern fix (see the V0.7c task).
      - pattern: '\bryzen\s*[3579]?\s*pro\s*4\d{3}'
        value: amd-ryzen-4000
      - pattern: '\bryzen\s*[3579]?\s*pro\s*5\d{3}'
        value: amd-ryzen-5000
      - pattern: '\bryzen\s*[3579]?\s*4\d{3}'
        value: amd-ryzen-4000
      - pattern: '\bryzen\s*[3579]?\s*5\d{3}'
        value: amd-ryzen-5000
      # "Ryzen AI" model names carry their own series digit after "AI"
      # (e.g. "Ryzen AI 9 365") - this must be checked before the
      # digit-series patterns below so an AI chip is never misread as a
      # plain 6000/7000/8000-series part. Still true with the series digit
      # now optional on those patterns: none of them can match through the
      # literal "AI" text between "Ryzen" and the model number anyway, but
      # this rule staying first is what makes that true by construction
      # rather than by accident of what "AI" happens to look like.
      - pattern: '\bryzen\s*ai\b'
        value: amd-ryzen-ai
      - pattern: '\bryzen\s*[3579]?\s*(?:pro\s*)?6\d{3}'
        value: amd-ryzen-6000
      - pattern: '\bryzen\s*[3579]?\s*(?:pro\s*)?7\d{3}'
        value: amd-ryzen-7000
      - pattern: '\bryzen\s*[3579]?\s*(?:pro\s*)?8\d{3}'
        value: amd-ryzen-8000
      # Intel — 4-digit model numbers, 10th gen onward
      - pattern: '\bi[3579][\s-]?10\d{2,3}'
        value: intel-10th
      - pattern: '\bi[3579][\s-]?11\d{2,3}'
        value: intel-11th
      - pattern: '\bi[3579][\s-]?12\d{2,3}'
        value: intel-12th
      - pattern: '\bi[3579][\s-]?13\d{2,3}'
        value: intel-13th
      # Core Ultra replaced the iX naming from Meteor Lake onward
      - pattern: '\bultra\s*[3579]\s*1\d{2}'
        value: intel-ultra-1
      - pattern: '\bultra\s*[3579]\s*2\d{2}'
        value: intel-ultra-2
      # Ordinal fallbacks (V0.7a) - AFTER every model-number pattern above,
      # since the model number is the stronger signal when both are present
      # (204/1094 listings came back partial on cpu_family alone; most
      # sellers write the generation as an ordinal instead of, or in
      # addition to, the model number: "i5 10th Gen", "12Gen Intel i5").
      #
      # NOTE on the capture group: it captures the FULL two-digit ordinal
      # (1[0-3], e.g. "10", "12"), not just the units digit. That's
      # deliberate - value 'intel-{1}th' then reproduces exactly
      # "intel-10th" / "intel-12th", identical to the values the
      # model-number patterns above already produce, so these hook straight
      # into the existing derive rules for generation/cpu_vendor below
      # without needing new ones. Capturing only the units digit would
      # produce "intel-0th"/"intel-2th" - a disjoint set of values with no
      # derive rule and a separate (wrong) bucket from same-generation
      # listings matched by model number.
      - pattern: '\bi[3579][\s-]?(1[0-3])th\b'
        value: 'intel-{1}th'
      - pattern: '\b(1[0-3])(?:th)?\s*gen(?:eration)?\b'
        value: 'intel-{1}th'
      # Bare model number that's lost adjacency to its i-series marker
      # ("Intel Core i7 vPRO 10610U" - "vPRO" sits between i7 and 10610U,
      # so the i[3579]-anchored patterns above never reach it). The
      # mandatory U/H/G suffix is what keeps this from capturing a storage
      # size ("512GB") or a clock speed ("2.80GHz") instead - both are
      # missing the digit-then-letter shape this requires.
      - pattern: '\b(1[0-3])\d{3}[uhg]\b'
        value: 'intel-{1}th'
    default: null

  ram_gb:
    from: title
    rules:
      # The unit suffix is MANDATORY. A bare `(\d+)\s*gb` will happily
      # capture "512GB SSD" as 512GB of RAM and poison the bucket.
      - pattern: '(\d{1,3})\s*gb\s*(?:ddr[45]|ram|memory)\b'
        value: '{1}'
        apply: to_int
      - pattern: '\b(?:ram|memory)\s*[:.]?\s*(\d{1,3})\s*gb\b'
        value: '{1}'
        apply: to_int
    default: null

  storage_gb:
    from: title
    rules:
      - pattern: '(\d)\s*tb\s*(?:ssd|nvme|hdd|m\.?2)\b'
        value: '{1}'
        apply: tb_to_gb
      - pattern: '(\d{3,4})\s*gb\s*(?:ssd|nvme|hdd|m\.?2)\b'
        value: '{1}'
        apply: to_int
    default: null

  touchscreen:
    from: title
    rules:
      - pattern: '\btouch(screen)?\b'
        value: true
    default: false

  # Not in bucket_key on purpose: whether "no OS" deserves its own bucket
  # is a V0.8 decision to be made with data, and adding it now doubles
  # bucket count against a min_samples of 12 we may already not reach.
  no_os:
    from: title
    rules:
      - pattern: '\bno\s+(os|operating\s+system)\b'
        value: true
    default: false

# ---------------------------------------------------------------------------
# 4. DERIVE — cross-field inference. Runs after extract. Only fills nulls
#    unless `overwrite: true`. This is what regex alone cannot do.
# ---------------------------------------------------------------------------
derive:
  - field: generation
    when: {cpu_family: amd-ryzen-4000}
    value: "1"
  - field: generation
    when: {cpu_family: amd-ryzen-5000}
    value: "2"
  - field: generation
    when: {cpu_family: intel-10th}
    value: "1"
  - field: generation
    when: {cpu_family: intel-11th}
    value: "2"
  - field: generation
    when: {cpu_family: intel-12th}
    value: "3"
  - field: generation
    when: {cpu_family: amd-ryzen-6000}
    value: "3"
  - field: generation
    when: {cpu_family: intel-13th}
    value: "4"
  - field: generation
    when: {cpu_family: amd-ryzen-7000}
    value: "4"
  - field: generation
    when: {cpu_family: intel-ultra-1}
    value: "5"
  - field: generation
    when: {cpu_family: amd-ryzen-8000}
    value: "5"
  - field: generation
    when: {cpu_family: intel-ultra-2}
    value: "6"
  - field: generation
    when: {cpu_family: amd-ryzen-ai}
    value: "6"

  # startswith on cpu_family's *value string* already covers every family
  # added above (intel-ultra-1/2 both start with "intel", amd-ryzen-ai
  # starts with "amd") - no new rules needed per family, just these two.
  - field: cpu_vendor
    when: {cpu_family: {startswith: amd}}
    value: amd
  - field: cpu_vendor
    when: {cpu_family: {startswith: intel}}
    value: intel

# ---------------------------------------------------------------------------
# 5. BUCKET — the unit of price comparison.
# ---------------------------------------------------------------------------
tiers:
  ram_tier:
    from: ram_gb
    breaks:
      - {max: 8,   label: "8"}
      - {max: 16,  label: "16"}
      - {max: 32,  label: "32"}
      - {min: 33,  label: "64+"}
  storage_tier:
    from: storage_gb
    breaks:
      - {max: 256,  label: "256"}
      - {max: 512,  label: "512"}
      - {max: 1024, label: "1TB"}
      - {min: 1025, label: "2TB+"}

bucket_key: [generation, cpu_family, ram_tier, storage_tier]

# Fields that MUST be non-null for a listing to contribute to a baseline.
# Listings failing this are still alertable on price alone — they just
# don't get a vote on what "normal" means. See design.md §5.2.
bucket_require: [generation, cpu_family]

# ---------------------------------------------------------------------------
# 6. SCORING
# ---------------------------------------------------------------------------
scoring:
  min_samples: 12              # below this, fall back to seed_baselines
  target_percentile: 25
  sanity_floor_pct: 25         # under this % of median => flag, do not alert
  best_offer_weight: 0.85      # BIN with Best Offer is an anchor, not a price
  include_shipping: true

# ---------------------------------------------------------------------------
# 7. SEED BASELINES — day-0 thresholds from the maintainer's own chart.
#    Used until a bucket reaches scoring.min_samples. Partial matches allowed;
#    most specific match wins.
# ---------------------------------------------------------------------------
seed_baselines:
  - match: {generation: "1", cpu_family: intel-10th, ram_tier: "16", storage_tier: "512"}
    p25: 220
    p50: 280
  - match: {generation: "2", cpu_family: intel-11th, ram_tier: "16", storage_tier: "512"}
    p25: 300
    p50: 380
  - match: {generation: "2", cpu_family: amd-ryzen-5000, ram_tier: "16", storage_tier: "512"}
    p25: 320
    p50: 400
  # Fallback for anything not listed above
  - match: {}
    p25: 250
    p50: 350

# ---------------------------------------------------------------------------
# 8. ALERTS
# ---------------------------------------------------------------------------
alerts:
  webhook_env: DISCORD_WEBHOOK_DEALS
  realert_drop_pct: 8          # re-alert if BIN drops this much below last alert
  cooldown_minutes: 60
  # The buying ceiling, distinct from search.filters.price above (a fetch
  # threshold - never truncate what gets collected). V0.9 reads this to
  # decide whether to alert at all, regardless of how good the deal score is.
  max_price_usd: 1200
