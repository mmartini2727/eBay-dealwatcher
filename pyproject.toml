[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dealwatch"
version = "0.1.0"
description = "A generic marketplace deal-monitoring engine with an eBay provider and MCP interface."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.10,<3.0",
  "pyyaml>=6.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["dealwatch"]
